<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek 桌宠对话</title>
  <style>
    :root { --bg: #141419; --panel: #1d1d24; --border: #2e2e38; --text: #e8e8ee; --muted: #9a9aa6; --accent: #4fc3f7; }
    * { box-sizing: border-box; }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal; font-weight: 400;
      src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
    }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      padding: 0 0 14px; /* 底部留尖角空间 */
      background: transparent; color: var(--text);
      font: 11px/1.6 'Press Start 2P', monospace;
      overflow: visible;
      animation: pop .32s cubic-bezier(.2, .85, .35, 1.12);
      transform-origin: 50% 100%; /* 从底部尖角（桌宠方向）生长 */
    }
    @keyframes pop {
      from { transform: scale(.25); opacity: 0; }
      60% { transform: scale(1.04); opacity: 1; }
      to { transform: scale(1); opacity: 1; }
    }
    /* 圆角气泡本体 */
    .bubble {
      flex: 1; display: flex; flex-direction: column;
      background: var(--bg); border: 3px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    /* 指向桌宠的尖角（朝下三角形） */
    .tail {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 13px solid var(--border);
    }
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--panel); border-bottom: 2px solid var(--border);
      user-select: none; -webkit-app-region: drag;
    }
    .titlebar .t { font-size: 11px; }
    .titlebar .close { cursor: pointer; color: var(--muted); font-size: 14px; padding: 0 4px; -webkit-app-region: no-drag; }
    .titlebar .close:hover { color: #ff5252; }
    .titlebar .action { cursor: pointer; color: var(--accent); font-size: 9px; margin-right: 12px; -webkit-app-region: no-drag; }
    .titlebar .action:hover { opacity: .8; }
    .footer { padding: 9px 12px; border-top: 1px solid var(--border); background: var(--panel); text-align: center; }
    .footer .link { cursor: pointer; color: var(--accent); font-size: 9px; }
    .footer .link:hover { text-decoration: underline; }
    #status { font-size: 9px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--border); min-height: 20px; }
    #status.working { color: var(--accent); }
    #status.completed { color: #7ed957; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 8px 10px; border-radius: 8px; word-break: break-word; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #2a4a66; color: #eaf6ff; }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg.placeholder { color: var(--muted); font-size: 9px; border: 1px dashed var(--border); }
    .inputbar { display: flex; gap: 8px; padding: 10px 12px; border-top: 2px solid var(--border); background: var(--panel); }
    /* 输入框：系统等宽字体，英文大小正常、更紧凑（像素字体会让英文显得过大） */
    #input {
      flex: 1; padding: 8px 10px; background: #121218; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #input:focus { border-color: var(--accent); }
    #send { padding: 9px 14px; background: var(--accent); color: #04141d; border: none; border-radius: 6px; font: 11px 'Press Start 2P', monospace; cursor: pointer; }
    #send:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="bubble">
    <div class="titlebar">
      <span class="t">DeepSeek 桌宠</span>
      <span>
        <span class="action" id="new" title="新对话">＋新对话</span>
        <span class="close" id="close" title="关闭">✕</span>
      </span>
    </div>
    <div id="status"></div>
    <div id="messages"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="和 DeepSeek 说点什么…" />
      <button id="send">发送</button>
    </div>
    <div class="footer">
      <span class="link" id="open-web">打开完整记录 ↗</span>
    </div>
  </div>
  <div class="tail"></div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const statusEl = document.getElementById('status')
    let currentAssistant = null // 当前正在流式累积的 assistant 消息元素

    function append(role, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + role
      el.textContent = text
      messages.appendChild(el)
      messages.scrollTop = messages.scrollHeight
      return el
    }

    function send() {
      const text = input.value.trim()
      if (!text) return
      append('user', text)
      input.value = ''
      window.chatAPI.send(text) // 发送后主进程收起聊天框，转由桌宠显示 Deep diving
    }

    document.getElementById('send').addEventListener('click', send)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
    document.getElementById('close').addEventListener('click', () => window.chatAPI.close())
    document.getElementById('open-web').addEventListener('click', () => window.chatAPI.openWeb())
    document.getElementById('new').addEventListener('click', () => {
      messages.innerHTML = ''
      currentAssistant = null
      statusEl.textContent = ''
      statusEl.className = ''
      window.chatAPI.newConversation()
    })

    // 接收流式回复与状态（chat-started / chat-delta / chat-message / chat-done）
    window.chatAPI.onEvent((msg) => {
      if (msg.type === 'chat-started') {
        currentAssistant = append('assistant', '') // 开新一轮，清空旧累积
        statusEl.textContent = 'Deep diving...'
        statusEl.className = 'working'
      } else if (msg.type === 'chat-delta') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent += msg.text || ''
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-message') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent = msg.text || currentAssistant.textContent // 权威完整文本
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-done') {
        statusEl.textContent = 'Completed'
        statusEl.className = 'completed'
        currentAssistant = null
      }
    })
  </script>
</body>
</html>
