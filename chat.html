<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seeki 桌宠对话</title>
  <style>
    /* ── Design Tokens：五级蓝白色阶 + 辅助色 ── */
    :root {
      --offwhite: #fbfdff;      /* Off White：聊天主体背景 */
      --pale: #f2f7fd;          /* Pale Blue：Header/Footer/Hover/Seeki 气泡 */
      --soft-2: #e5eef8;        /* 最淡：分割线、消息气泡边 */
      --soft: #c0d4ec;          /* Soft Blue：默认控件边框、选中 */
      --strong: #9ab9e0;        /* 外框强边框 */
      --primary: #4a90d9;       /* Primary Blue：发送按钮、用户气泡、核心交互 */
      --primary-strong: #3a7cc0; /* Primary 深一档：hover/active */
      --deep: #1f3a5c;          /* Deep Blue：正文、重要文字 */
      --muted: #6d86a3;         /* 次要灰蓝 */
      --ok: #18a058;            /* 完成状态绿 */
      --danger: #e06060;        /* 关闭 hover */
    }
    * { box-sizing: border-box; }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal; font-weight: 400;
      src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
    }
    html, body { margin: 0; }
    body {
      position: relative;
      height: 100vh;          /* 占满窗口，使窗口高度由主进程精确控制 */
      padding: 0 0 16px;      /* 底部留尖角空间（TAIL_SPACE） */
      background: transparent;
      overflow: hidden;       /* 禁止 body 级滚动/裁剪，滚动只发生在 #messages */
      animation: pop .26s ease-out;
      transform-origin: 50% 100%;
    }
    @keyframes pop {
      from { transform: translateY(6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    /* 外框：最强边框 + 浅像素投影 + 顶部高光 */
    .bubble {
      display: flex; flex-direction: column;
      max-height: 314px;   /* = MAX_HEIGHT(330) - TAIL_SPACE(16)；尖角始终完整可见，超出交给 #messages 滚动 */
      background: var(--offwhite);
      border: 2px solid var(--strong);
      border-radius: 9px;
      box-shadow: 0 2px 10px -3px rgba(31, 58, 92, .18), inset 0 1px 0 rgba(255, 255, 255, .8);
      overflow: hidden;
    }
    /* 主尖角：白底 + 强边框 */
    .tail {
      position: absolute; left: 50%; bottom: 8px;
      width: 15px; height: 15px;
      background: var(--offwhite);
      border-right: 2px solid var(--strong);
      border-bottom: 2px solid var(--strong);
      transform: translateX(-50%) rotate(45deg);
    }
    /* 单行 Mini Toolbar（Environment 层：Workspace + Model + 窗口动作） */
    .titlebar {
      flex: none; /* 固定：不参与消息滚动 */
      display: flex; align-items: center; gap: 6px;
      padding: 5px 9px; background: var(--pale); border-bottom: 1px solid var(--soft-2);
      user-select: none; -webkit-app-region: drag;
    }
    .titlebar .t { font: 10px 'Press Start 2P', monospace; color: var(--primary); flex: none; }
    .titlebar .folder-icon { flex: none; display: block; }
    #folder-select {
      flex: 1; min-width: 64px; max-width: 118px;
      padding: 2px 6px; background: var(--offwhite); border: 1px solid var(--soft);
      border-radius: 6px; color: var(--deep); outline: none;
      font: 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
      transition: border-color .15s, background .15s;
      -webkit-app-region: no-drag;
    }
    #folder-select:hover { background: var(--pale); }
    #folder-select:focus { border-color: var(--primary); }
    .model-dot { flex: none; width: 6px; height: 6px; background: var(--primary); border-radius: 1px; margin-left: 2px; }
    #model-select {
      flex: none; min-width: 56px; max-width: 102px;
      padding: 2px 6px; background: var(--offwhite); border: 1px solid var(--soft);
      border-radius: 6px; color: var(--deep); outline: none;
      font: 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
      transition: border-color .15s, background .15s;
      -webkit-app-region: no-drag;
    }
    #model-select:hover { background: var(--pale); }
    #model-select:focus { border-color: var(--primary); }
    #model-select:disabled { color: var(--muted); background: var(--pale); }
    .titlebar .actions { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; -webkit-app-region: no-drag; }
    .titlebar .close { cursor: pointer; color: var(--muted); font-size: 13px; padding: 0 2px; transition: color .15s; -webkit-app-region: no-drag; }
    .titlebar .close:hover { color: var(--danger); }
    .titlebar .action { cursor: pointer; color: var(--primary); font: 8px 'Press Start 2P', monospace; transition: color .15s; -webkit-app-region: no-drag; }
    .titlebar .action:hover { color: var(--primary-strong); }
    /* 会话导航条（Conversation 层）：辅助导航，弱于 Header，不是表单输入框 */
    .sessionbar {
      flex: none; /* 固定：不参与消息滚动 */
      position: relative; display: flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 10px;
      background: transparent; border-bottom: 1px solid var(--soft-2);
      cursor: pointer; user-select: none; -webkit-app-region: no-drag;
      transition: background .15s;
    }
    .sessionbar:hover, .sessionbar.open { background: var(--pale); }
    .sessionbar:focus-visible { outline: 1px solid var(--primary); outline-offset: -1px; }
    .sessionbar .chat-icon { flex: none; display: block; }
    .sessionbar .session-name {
      flex: 1; min-width: 0;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      color: var(--deep); text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
    }
    .sessionbar .session-name.empty { color: var(--muted); }
    .sessionbar .session-arrow { flex: none; font-size: 8px; line-height: 1; color: var(--muted); transition: transform .15s; }
    .sessionbar.open .session-arrow { transform: rotate(180deg); }
    /* 会话下拉浮层：浮在消息区之上，不参与布局（不改变窗口高度） */
    .session-menu {
      position: absolute; top: calc(100% + 2px); left: 8px; right: 8px; z-index: 30;
      display: flex; flex-direction: column; max-height: 220px;
      background: var(--offwhite); border: 1px solid var(--soft); border-radius: 6px;
      box-shadow: 0 4px 14px -4px rgba(31, 58, 92, .25);
      overflow: hidden;
    }
    .session-menu[hidden] { display: none; }
    .session-menu-head {
      flex: none; padding: 4px 10px; border-bottom: 1px solid var(--soft-2);
      font: 8px 'Press Start 2P', monospace; color: var(--muted);
    }
    .session-menu-list { flex: 1; overflow-y: auto; min-height: 0; }
    .session-item {
      display: flex; align-items: center; gap: 6px; padding: 5px 10px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      color: var(--deep); cursor: pointer; transition: background .12s;
    }
    .session-item:hover { background: var(--pale); }
    .session-item.active { background: var(--pale); }
    .session-item .check { flex: none; width: 12px; font-size: 10px; color: var(--primary); }
    .session-item .check.hide { visibility: hidden; }
    .session-item-title { flex: 1; min-width: 0; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
    .session-menu-divider { flex: none; height: 1px; background: var(--soft-2); }
    .session-menu-new {
      flex: none; padding: 5px 10px; background: none; border: none; text-align: left; cursor: pointer;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      color: var(--primary); transition: background .12s, color .12s;
    }
    .session-menu-new:hover { background: var(--pale); color: var(--primary-strong); }
    /* 状态条：像素状态点 + 文字 */
    #status { flex: none; font: 8px 'Press Start 2P', monospace; color: var(--muted); padding: 2px 10px; min-height: 0; }
    #status:not(:empty)::before { content: ''; display: inline-block; width: 4px; height: 4px; margin-right: 5px; background: currentColor; vertical-align: 1px; }
    #status.working { color: var(--primary); }
    #status.completed { color: var(--ok); }
    #status.error { color: var(--danger); }
    /* 消息区：顶部留少量呼吸空间，避免贴住会话导航条 */
    #messages {
      flex: 1 1 auto;       /* 占据 Header/导航/输入区之外的剩余空间 */
      min-height: 0;        /* 允许收缩，配合 overflow-y 在剩余空间内滚动 */
      overflow-y: auto;     /* 唯一纵向滚动容器 */
      padding: 14px 10px 10px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .msg {
      max-width: 82%;
      padding: 5px 9px; border-radius: 6px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--deep);
      word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
      animation: msg-in .18s ease-out;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; background: var(--primary); color: #ffffff; }
    .msg.assistant { position: relative; align-self: flex-start; background: var(--pale); border: 1px solid var(--soft-2); color: var(--deep); }
    /* Seeki 气泡小尾巴：指向下方（桌宠方向） */
    .msg.assistant::after {
      content: ''; position: absolute;
      bottom: -3px; left: 7px;
      width: 7px; height: 7px;
      background: inherit;
      border-right: 1px solid var(--soft-2);
      border-bottom: 1px solid var(--soft-2);
      transform: rotate(45deg);
    }
    .msg.placeholder { color: var(--muted); font-size: 11px; border: 1px dashed var(--soft); }
    /* 输入区：Secondary Interaction Layer */
    .inputbar { flex: none; display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--soft-2); background: var(--pale); }
    #input {
      flex: 1; padding: 5px 9px; background: var(--offwhite); border: 1px solid var(--soft);
      border-radius: 6px; color: var(--deep); outline: none;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      transition: border-color .15s;
    }
    #input::placeholder { color: var(--muted); }
    #input:focus { border-color: var(--primary); }
    #send {
      padding: 5px 14px; background: var(--primary); color: #ffffff; border: none; border-radius: 6px;
      font: 9px 'Press Start 2P', monospace; cursor: pointer;
      transition: background .15s, transform .06s;
    }
    #send:hover { background: var(--primary-strong); }
    #send:active { transform: translateY(1px); }
    /* Footer：轻量辅助入口 */
    .footer { flex: none; padding: 4px 10px; border-top: 1px solid var(--soft-2); background: var(--pale); text-align: center; }
    .footer .link { cursor: pointer; color: var(--muted); font: 8px 'Press Start 2P', monospace; transition: color .15s; }
    .footer .link:hover { color: var(--primary-strong); }
  </style>
</head>
<body>
  <div class="bubble">
    <div class="titlebar">
      <span class="t">Seeki</span>
      <svg class="folder-icon" width="15" height="12" viewBox="0 0 15 12" aria-hidden="true">
        <rect x="0" y="0" width="6" height="2" style="fill: var(--soft)" />
        <rect x="0" y="2" width="15" height="10" style="fill: var(--primary)" />
        <rect x="1" y="4" width="13" height="1" style="fill: var(--pale)" />
      </svg>
      <select id="folder-select" title="对话文件夹"></select>
      <span class="model-dot" title="模型"></span>
      <select id="model-select" title="模型" disabled></select>
      <span class="actions">
        <span class="action" id="new" title="新对话">＋新对话</span>
        <span class="close" id="close" title="关闭">✕</span>
      </span>
    </div>
    <div class="sessionbar" id="sessionbar" role="button" tabindex="0" title="当前对话，点击切换">
      <svg class="chat-icon" width="13" height="12" viewBox="0 0 13 12" aria-hidden="true">
        <rect x="0" y="0" width="11" height="9" style="fill: var(--primary)" />
        <rect x="2" y="2" width="2" height="2" style="fill: var(--pale)" />
        <rect x="5" y="2" width="2" height="2" style="fill: var(--pale)" />
        <rect x="8" y="2" width="2" height="2" style="fill: var(--pale)" />
        <rect x="3" y="9" width="3" height="1" style="fill: var(--primary)" />
        <rect x="2" y="10" width="1" height="1" style="fill: var(--primary)" />
      </svg>
      <span class="session-name empty" id="session-name">新对话</span>
      <span class="session-arrow" aria-hidden="true">▾</span>
      <div class="session-menu" id="session-menu" hidden>
        <div class="session-menu-head">最近对话</div>
        <div class="session-menu-list" id="session-menu-list"></div>
        <div class="session-menu-divider"></div>
        <button class="session-menu-new" id="session-menu-new" type="button">＋ 新对话</button>
      </div>
    </div>
    <div id="status"></div>
    <div id="messages"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="和 Seeki 说点什么…" />
      <button id="send">发送</button>
    </div>
    <div class="footer">
      <span class="link" id="open-web">打开完整记录 ↗</span>
    </div>
  </div>
  <div class="tail"></div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const statusEl = document.getElementById('status')
    const folderSelect = document.getElementById('folder-select')
    const modelSelect = document.getElementById('model-select')
    const sessionBar = document.getElementById('sessionbar')
    const sessionName = document.getElementById('session-name')
    const sessionMenu = document.getElementById('session-menu')
    const sessionMenuList = document.getElementById('session-menu-list')
    let currentAssistant = null // 当前正在流式累积的 assistant 消息元素

    function append(role, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + role
      el.textContent = text
      messages.appendChild(el)
      messages.scrollTop = messages.scrollHeight
      return el
    }

    // 渲染对话文件夹下拉（folder 名称来自 harness workspace，不硬编码）
    function renderFolders(folders, currentId) {
      const prev = folderSelect.value
      folderSelect.innerHTML = ''
      for (const f of folders || []) {
        const opt = document.createElement('option')
        opt.value = f.id
        opt.dataset.path = f.path
        opt.textContent = f.title
        folderSelect.appendChild(opt)
      }
      if ((folders || []).some((f) => f.id === currentId)) folderSelect.value = currentId
      else if ((folders || []).some((f) => f.id === prev)) folderSelect.value = prev
    }

    // 渲染模型下拉（模型来自 harness llm.models，配置驱动，不硬编码）
    function renderModels(models, current) {
      const prev = modelSelect.value
      modelSelect.innerHTML = ''
      for (const m of models || []) {
        const opt = document.createElement('option')
        opt.value = m.provider + '|' + m.model
        opt.dataset.provider = m.provider
        opt.dataset.model = m.model
        opt.textContent = m.name
        modelSelect.appendChild(opt)
      }
      modelSelect.disabled = (models || []).length === 0
      if ((models || []).length === 0) {
        const opt = document.createElement('option')
        opt.value = ''
        opt.textContent = '无可用模型'
        modelSelect.appendChild(opt)
        modelSelect.value = ''
        return
      }
      const key = current ? (current.provider + '|' + current.model) : ''
      if ((models || []).some((m) => (m.provider + '|' + m.model) === key)) modelSelect.value = key
      else if ((models || []).some((m) => (m.provider + '|' + m.model) === prev)) modelSelect.value = prev
    }

    // 渲染会话导航条 + 浮层列表：当前会话名为主信息，历史对话列在浮层中（当前项打 ✓）
    function renderSessions(sessions, currentId) {
      const list = sessions || []
      const current = list.find((s) => s.id === currentId)
      sessionName.textContent = current ? (current.title || '（未命名对话）') : '新对话'
      sessionName.classList.toggle('empty', !current)
      sessionMenuList.innerHTML = ''
      for (const s of list) {
        const item = document.createElement('div')
        item.className = 'session-item' + (s.id === currentId ? ' active' : '')
        const check = document.createElement('span')
        check.className = 'check' + (s.id === currentId ? '' : ' hide')
        check.textContent = '✓'
        const title = document.createElement('span')
        title.className = 'session-item-title'
        title.textContent = s.title || '（未命名对话）'
        item.appendChild(check)
        item.appendChild(title)
        item.addEventListener('click', (e) => {
          e.stopPropagation() // 避免冒泡到 sessionbar 触发 toggle
          closeSessionMenu()
          window.chatAPI.selectSession(s.id)
        })
        sessionMenuList.appendChild(item)
      }
    }

    function openSessionMenu() {
      sessionMenu.hidden = false
      sessionBar.classList.add('open')
      // 限制浮层高度不超过气泡可视范围（底部留尖角 + 外框边距），避免撑开/裁切；过长列表内部滚动
      const rect = sessionBar.getBoundingClientRect()
      const avail = window.innerHeight - rect.bottom - 24 // 16px 尖角 + 2px 外框 + 6px 呼吸
      sessionMenu.style.maxHeight = Math.max(64, Math.min(220, avail)) + 'px'
    }
    function closeSessionMenu() {
      sessionMenu.hidden = true
      sessionBar.classList.remove('open')
    }

    function send() {
      const text = input.value.trim()
      if (!text) return
      append('user', text)
      input.value = ''
      window.chatAPI.send(text) // 发送后主进程收起聊天框，转由桌宠显示 Deep diving
    }

    document.getElementById('send').addEventListener('click', send)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
    document.getElementById('close').addEventListener('click', () => window.chatAPI.close())
    document.getElementById('open-web').addEventListener('click', () => window.chatAPI.openWeb())
    document.getElementById('new').addEventListener('click', () => {
      messages.innerHTML = ''
      currentAssistant = null
      statusEl.textContent = ''
      statusEl.className = ''
      window.chatAPI.newConversation()
    })
    folderSelect.addEventListener('change', () => {
      const opt = folderSelect.selectedOptions[0]
      if (!opt) return
      window.chatAPI.selectFolder(opt.value, opt.dataset.path)
    })
    sessionBar.addEventListener('click', () => {
      if (sessionMenu.hidden) openSessionMenu()
      else closeSessionMenu()
    })
    sessionBar.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return
      e.preventDefault()
      if (sessionMenu.hidden) openSessionMenu()
      else closeSessionMenu()
    })
    document.getElementById('session-menu-new').addEventListener('click', (e) => {
      e.stopPropagation()
      closeSessionMenu()
      window.chatAPI.newConversation() // 「＋新对话」
    })
    document.addEventListener('click', (e) => {
      if (!sessionBar.contains(e.target)) closeSessionMenu() // 点击外部关闭
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSessionMenu()
    })
    modelSelect.addEventListener('change', () => {
      const opt = modelSelect.selectedOptions[0]
      if (!opt || !opt.dataset.provider || !opt.dataset.model) return
      window.chatAPI.selectModel(opt.dataset.provider, opt.dataset.model)
    })

    // 气泡尺寸随内容自适应：观测气泡高度上报主进程，由主进程调整窗口大小（底部锚定桌宠）
    const bubble = document.querySelector('.bubble')
    new ResizeObserver(() => {
      window.chatAPI.resize(bubble.offsetHeight)
    }).observe(bubble)

    // 接收流式回复与状态（chat-folders / chat-history / chat-started / chat-delta / chat-message / chat-done）
    window.chatAPI.onEvent((msg) => {
      if (msg.type === 'chat-folders') {
        renderFolders(msg.folders, msg.currentId)
      } else if (msg.type === 'chat-sessions') {
        renderSessions(msg.sessions, msg.currentId)
      } else if (msg.type === 'chat-models') {
        renderModels(msg.models, msg.current)
      } else if (msg.type === 'chat-history') {
        messages.innerHTML = '' // 切换到某文件夹后展示其历史
        currentAssistant = null
        for (const m of msg.messages || []) append(m.role, m.text)
      } else if (msg.type === 'chat-started') {
        currentAssistant = append('assistant', '') // 开新一轮，清空旧累积
        statusEl.textContent = 'Deep diving...'
        statusEl.className = 'working'
      } else if (msg.type === 'chat-delta') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent += msg.text || ''
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-message') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent = msg.text || currentAssistant.textContent // 权威完整文本
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-done') {
        statusEl.textContent = 'Completed'
        statusEl.className = 'completed'
        currentAssistant = null
      } else if (msg.type === 'chat-error') {
        statusEl.textContent = msg.message || '出错了'
        statusEl.className = 'error'
      }
    })
  </script>
</body>
</html>
