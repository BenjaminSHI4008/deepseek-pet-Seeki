<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek 桌宠对话</title>
  <style>
    :root { --bg: #141419; --panel: #1d1d24; --border: #2e2e38; --text: #e8e8ee; --muted: #9a9aa6; --accent: #4fc3f7; }
    * { box-sizing: border-box; }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal; font-weight: 400;
      src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
    }
    html, body { margin: 0; }
    body {
      position: relative;
      padding: 0 0 16px; /* 底部留尖角空间 */
      background: transparent;
      overflow: visible;
      animation: pop .28s cubic-bezier(.2, .85, .35, 1.1);
      transform-origin: 50% 100%; /* 从底部尖角（桌宠方向）生长 */
    }
    @keyframes pop {
      from { transform: scale(.3); opacity: 0; }
      60% { transform: scale(1.03); opacity: 1; }
      to { transform: scale(1); opacity: 1; }
    }
    /* 圆角气泡本体：随内容自适应，消息区超出上限时内部滚动 */
    .bubble {
      display: flex; flex-direction: column;
      background: var(--bg); border: 3px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    /* 尖角：与气泡融为一体的朝下尖角（微信/漫画对话框式） */
    .tail {
      position: absolute; left: 50%; bottom: 8px;
      width: 15px; height: 15px;
      background: var(--bg);
      border-right: 3px solid var(--border);
      border-bottom: 3px solid var(--border);
      transform: translateX(-50%) rotate(45deg);
    }
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; background: var(--panel); border-bottom: 2px solid var(--border);
      user-select: none; -webkit-app-region: drag;
    }
    .titlebar .t { font: 10px 'Press Start 2P', monospace; }
    .titlebar .close { cursor: pointer; color: var(--muted); font-size: 14px; padding: 0 4px; -webkit-app-region: no-drag; }
    .titlebar .close:hover { color: #ff5252; }
    .titlebar .action { cursor: pointer; color: var(--accent); font: 9px 'Press Start 2P', monospace; margin-right: 12px; -webkit-app-region: no-drag; }
    .titlebar .action:hover { opacity: .8; }
    #status { font: 9px 'Press Start 2P', monospace; color: var(--muted); padding: 5px 12px; border-bottom: 1px solid var(--border); min-height: 18px; }
    #status.working { color: var(--accent); }
    #status.completed { color: #7ed957; }
    /* 消息区：随内容伸缩，超上限滚动；正文用系统字体，中英混排协调、长英文可换行 */
    #messages {
      overflow-y: auto;
      max-height: 230px;
      padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg {
      max-width: 90%;
      padding: 7px 10px; border-radius: 8px;
      font: 13px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: #2a4a66; color: #eaf6ff; }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg.placeholder { color: var(--muted); font-size: 12px; border: 1px dashed var(--border); }
    .inputbar { display: flex; gap: 8px; padding: 9px 12px; border-top: 2px solid var(--border); background: var(--panel); }
    #input {
      flex: 1; padding: 7px 10px; background: #121218; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    }
    #input:focus { border-color: var(--accent); }
    #send { padding: 8px 13px; background: var(--accent); color: #04141d; border: none; border-radius: 6px; font: 10px 'Press Start 2P', monospace; cursor: pointer; }
    #send:hover { opacity: .9; }
    .footer { padding: 7px 12px; border-top: 1px solid var(--border); background: var(--panel); text-align: center; }
    .footer .link { cursor: pointer; color: var(--accent); font: 9px 'Press Start 2P', monospace; }
    .footer .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bubble">
    <div class="titlebar">
      <span class="t">DeepSeek 桌宠</span>
      <span>
        <span class="action" id="new" title="新对话">＋新对话</span>
        <span class="close" id="close" title="关闭">✕</span>
      </span>
    </div>
    <div id="status"></div>
    <div id="messages"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="和 DeepSeek 说点什么…" />
      <button id="send">发送</button>
    </div>
    <div class="footer">
      <span class="link" id="open-web">打开完整记录 ↗</span>
    </div>
  </div>
  <div class="tail"></div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const statusEl = document.getElementById('status')
    let currentAssistant = null // 当前正在流式累积的 assistant 消息元素

    function append(role, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + role
      el.textContent = text
      messages.appendChild(el)
      messages.scrollTop = messages.scrollHeight
      return el
    }

    function send() {
      const text = input.value.trim()
      if (!text) return
      append('user', text)
      input.value = ''
      window.chatAPI.send(text) // 发送后主进程收起聊天框，转由桌宠显示 Deep diving
    }

    document.getElementById('send').addEventListener('click', send)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
    document.getElementById('close').addEventListener('click', () => window.chatAPI.close())
    document.getElementById('open-web').addEventListener('click', () => window.chatAPI.openWeb())
    document.getElementById('new').addEventListener('click', () => {
      messages.innerHTML = ''
      currentAssistant = null
      statusEl.textContent = ''
      statusEl.className = ''
      window.chatAPI.newConversation()
    })

    // 气泡尺寸随内容自适应：观测气泡高度上报主进程，由主进程调整窗口大小（底部锚定桌宠）
    const bubble = document.querySelector('.bubble')
    new ResizeObserver(() => {
      window.chatAPI.resize(bubble.offsetHeight)
    }).observe(bubble)

    // 接收流式回复与状态（chat-started / chat-delta / chat-message / chat-done）
    window.chatAPI.onEvent((msg) => {
      if (msg.type === 'chat-started') {
        currentAssistant = append('assistant', '') // 开新一轮，清空旧累积
        statusEl.textContent = 'Deep diving...'
        statusEl.className = 'working'
      } else if (msg.type === 'chat-delta') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent += msg.text || ''
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-message') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent = msg.text || currentAssistant.textContent // 权威完整文本
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-done') {
        statusEl.textContent = 'Completed'
        statusEl.className = 'completed'
        currentAssistant = null
      }
    })
  </script>
</body>
</html>
