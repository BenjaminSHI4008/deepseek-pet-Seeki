<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seeki 桌宠对话</title>
  <style>
    :root {
      --bg: #fbfdff;            /* 气泡主体：近白 */
      --panel: #eef4fb;         /* 栏区：极浅蓝 */
      --border: #c3d6ee;        /* 分割线：浅蓝 */
      --border-strong: #8fb3e0; /* 气泡边框：蓝 */
      --text: #17324f;          /* 正文：深蓝 */
      --muted: #647a92;         /* 次要：灰蓝 */
      --accent: #3b82f6;        /* 强调蓝 */
      --ok: #16a34a;            /* 完成状态：绿 */
    }
    * { box-sizing: border-box; }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal; font-weight: 400;
      src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
    }
    html, body { margin: 0; }
    body {
      position: relative;
      padding: 0 0 16px; /* 底部留尖角空间 */
      background: transparent;
      overflow: visible;
      animation: pop .28s cubic-bezier(.2, .85, .35, 1.1);
      transform-origin: 50% 100%; /* 从底部尖角（桌宠方向）生长 */
    }
    @keyframes pop {
      from { transform: scale(.3); opacity: 0; }
      60% { transform: scale(1.03); opacity: 1; }
      to { transform: scale(1); opacity: 1; }
    }
    /* 圆角气泡本体：白底 + 蓝色像素边框，轻微阶梯圆角，浅阴影 + 顶部像素高光 */
    .bubble {
      display: flex; flex-direction: column;
      background: var(--bg);
      border: 2px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 3px 12px -4px rgba(30, 70, 140, .22), inset 0 1px 0 rgba(255, 255, 255, .85);
      overflow: hidden;
    }
    /* 尖角：与气泡同风格（白底 + 蓝色边） */
    .tail {
      position: absolute; left: 50%; bottom: 8px;
      width: 15px; height: 15px;
      background: var(--bg);
      border-right: 2px solid var(--border-strong);
      border-bottom: 2px solid var(--border-strong);
      transform: translateX(-50%) rotate(45deg);
    }
    /* 单行工具栏：Seeki + 文件夹 + 新对话 + 关闭 */
    .titlebar {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
      user-select: none; -webkit-app-region: drag;
    }
    .titlebar .t { font: 10px 'Press Start 2P', monospace; color: var(--accent); flex: none; }
    .titlebar .folder-icon { flex: none; display: block; }
    #folder-select {
      flex: 1; min-width: 70px; max-width: 150px;
      padding: 4px 6px; background: #ffffff; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
      font: 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
      -webkit-app-region: no-drag;
    }
    #folder-select:focus { border-color: var(--accent); }
    .titlebar .actions { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; -webkit-app-region: no-drag; }
    .titlebar .close { cursor: pointer; color: var(--muted); font-size: 13px; padding: 0 2px; -webkit-app-region: no-drag; }
    .titlebar .close:hover { color: #ef4444; }
    .titlebar .action { cursor: pointer; color: var(--accent); font: 8px 'Press Start 2P', monospace; -webkit-app-region: no-drag; }
    .titlebar .action:hover { opacity: .8; }
    /* 状态条：极薄的一行（Deep diving / Completed） */
    #status { font: 8px 'Press Start 2P', monospace; color: var(--muted); padding: 2px 10px; min-height: 0; }
    #status.working { color: var(--accent); }
    #status.completed { color: var(--ok); }
    /* 消息区：随内容伸缩，超上限滚动；正文用系统字体，中英混排协调、长英文可换行 */
    #messages {
      overflow-y: auto;
      max-height: 200px;
      padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg {
      max-width: 82%;
      padding: 5px 9px; border-radius: 7px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: var(--accent); color: #ffffff; }
    .msg.assistant { align-self: flex-start; background: #ffffff; border: 1px solid var(--border); color: var(--text); }
    .msg.placeholder { color: var(--muted); font-size: 11px; border: 1px dashed var(--border); }
    .inputbar { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--border); background: var(--panel); }
    #input {
      flex: 1; padding: 5px 9px; background: #ffffff; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    }
    #input:focus { border-color: var(--accent); }
    #send { padding: 5px 14px; background: var(--accent); color: #ffffff; border: none; border-radius: 6px; font: 9px 'Press Start 2P', monospace; cursor: pointer; }
    #send:hover { opacity: .9; }
    .footer { padding: 4px 10px; border-top: 1px solid var(--border); background: var(--panel); text-align: center; }
    .footer .link { cursor: pointer; color: var(--accent); font: 8px 'Press Start 2P', monospace; }
    .footer .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bubble">
    <div class="titlebar">
      <span class="t">Seeki</span>
      <svg class="folder-icon" width="15" height="12" viewBox="0 0 15 12" aria-hidden="true">
        <rect x="0" y="0" width="6" height="2" fill="#60a5fa" />
        <rect x="0" y="2" width="15" height="10" fill="#3b82f6" />
        <rect x="1" y="4" width="13" height="1" fill="#93c5fd" />
      </svg>
      <select id="folder-select" title="对话文件夹"></select>
      <span class="actions">
        <span class="action" id="new" title="新对话">＋新对话</span>
        <span class="close" id="close" title="关闭">✕</span>
      </span>
    </div>
    <div id="status"></div>
    <div id="messages"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="和 Seeki 说点什么…" />
      <button id="send">发送</button>
    </div>
    <div class="footer">
      <span class="link" id="open-web">打开完整记录 ↗</span>
    </div>
  </div>
  <div class="tail"></div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const statusEl = document.getElementById('status')
    const folderSelect = document.getElementById('folder-select')
    let currentAssistant = null // 当前正在流式累积的 assistant 消息元素

    function append(role, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + role
      el.textContent = text
      messages.appendChild(el)
      messages.scrollTop = messages.scrollHeight
      return el
    }

    // 渲染对话文件夹下拉（folder 名称来自 harness workspace，不硬编码）
    function renderFolders(folders, currentId) {
      const prev = folderSelect.value
      folderSelect.innerHTML = ''
      for (const f of folders || []) {
        const opt = document.createElement('option')
        opt.value = f.id
        opt.dataset.path = f.path
        opt.textContent = f.title
        folderSelect.appendChild(opt)
      }
      if ((folders || []).some((f) => f.id === currentId)) folderSelect.value = currentId
      else if ((folders || []).some((f) => f.id === prev)) folderSelect.value = prev
    }

    function send() {
      const text = input.value.trim()
      if (!text) return
      append('user', text)
      input.value = ''
      window.chatAPI.send(text) // 发送后主进程收起聊天框，转由桌宠显示 Deep diving
    }

    document.getElementById('send').addEventListener('click', send)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
    document.getElementById('close').addEventListener('click', () => window.chatAPI.close())
    document.getElementById('open-web').addEventListener('click', () => window.chatAPI.openWeb())
    document.getElementById('new').addEventListener('click', () => {
      messages.innerHTML = ''
      currentAssistant = null
      statusEl.textContent = ''
      statusEl.className = ''
      window.chatAPI.newConversation()
    })
    folderSelect.addEventListener('change', () => {
      const opt = folderSelect.selectedOptions[0]
      if (!opt) return
      window.chatAPI.selectFolder(opt.value, opt.dataset.path)
    })

    // 气泡尺寸随内容自适应：观测气泡高度上报主进程，由主进程调整窗口大小（底部锚定桌宠）
    const bubble = document.querySelector('.bubble')
    new ResizeObserver(() => {
      window.chatAPI.resize(bubble.offsetHeight)
    }).observe(bubble)

    // 接收流式回复与状态（chat-folders / chat-history / chat-started / chat-delta / chat-message / chat-done）
    window.chatAPI.onEvent((msg) => {
      if (msg.type === 'chat-folders') {
        renderFolders(msg.folders, msg.currentId)
      } else if (msg.type === 'chat-history') {
        messages.innerHTML = '' // 切换到某文件夹后展示其历史
        currentAssistant = null
        for (const m of msg.messages || []) append(m.role, m.text)
      } else if (msg.type === 'chat-started') {
        currentAssistant = append('assistant', '') // 开新一轮，清空旧累积
        statusEl.textContent = 'Deep diving...'
        statusEl.className = 'working'
      } else if (msg.type === 'chat-delta') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent += msg.text || ''
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-message') {
        if (!currentAssistant) currentAssistant = append('assistant', '')
        currentAssistant.textContent = msg.text || currentAssistant.textContent // 权威完整文本
        messages.scrollTop = messages.scrollHeight
      } else if (msg.type === 'chat-done') {
        statusEl.textContent = 'Completed'
        statusEl.className = 'completed'
        currentAssistant = null
      }
    })
  </script>
</body>
</html>
