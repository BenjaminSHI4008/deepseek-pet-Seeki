<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek 桌宠对话</title>
  <style>
    :root { --bg: #141419; --panel: #1d1d24; --border: #2e2e38; --text: #e8e8ee; --muted: #9a9aa6; --accent: #4fc3f7; }
    * { box-sizing: border-box; }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal; font-weight: 400;
      src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
    }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 12px/1.6 'Press Start 2P', monospace;
      border: 3px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--panel); border-bottom: 2px solid var(--border);
      user-select: none;
    }
    .titlebar .t { font-size: 11px; }
    .titlebar .close { cursor: pointer; color: var(--muted); font-size: 14px; padding: 0 4px; }
    .titlebar .close:hover { color: #ff5252; }
    #status { font-size: 9px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--border); min-height: 20px; }
    #status.working { color: var(--accent); }
    #status.completed { color: #7ed957; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 8px 10px; border-radius: 8px; word-break: break-word; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #2a4a66; color: #eaf6ff; }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg.placeholder { color: var(--muted); font-size: 9px; border: 1px dashed var(--border); }
    .inputbar { display: flex; gap: 8px; padding: 10px 12px; border-top: 2px solid var(--border); background: var(--panel); }
    #input {
      flex: 1; padding: 9px 10px; background: #121218; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font: 11px 'Press Start 2P', monospace; outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send { padding: 9px 14px; background: var(--accent); color: #04141d; border: none; border-radius: 6px; font: 11px 'Press Start 2P', monospace; cursor: pointer; }
    #send:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="t">DeepSeek 桌宠</span>
    <span class="close" id="close" title="关闭">✕</span>
  </div>
  <div id="status"></div>
  <div id="messages"></div>
  <div class="inputbar">
    <input id="input" type="text" placeholder="和 DeepSeek 说点什么…" />
    <button id="send">发送</button>
  </div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const statusEl = document.getElementById('status')

    function append(role, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + role
      el.textContent = text
      messages.appendChild(el)
      messages.scrollTop = messages.scrollHeight
      return el
    }

    function send() {
      const text = input.value.trim()
      if (!text) return
      append('user', text)
      input.value = ''
      window.chatAPI.send(text) // P2：经主进程 → 插件 → harness 发起对话
    }

    document.getElementById('send').addEventListener('click', send)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
    document.getElementById('close').addEventListener('click', () => window.chatAPI.close())

    // P2：接收流式回复与状态
    window.chatAPI.onMessage((msg) => {
      // 占位：P2 落地后处理分片追加/完整消息
      append('assistant', msg.text ?? msg)
    })
    window.chatAPI.onStatus((status) => {
      statusEl.textContent = status === 'working' ? 'Deep diving...' : status === 'completed' ? 'Completed' : ''
      statusEl.className = status
    })
  </script>
</body>
</html>
