<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Deepseek 桌宠</title>
    <style>
      /* 像素字体（本地打包，离线/国内均可加载） */
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Fusion Pixel';
        font-style: normal;
        font-weight: 400;
        src: url('./assets/fonts/fusion-pixel-12px-proportional-zh_hans.woff2') format('woff2');
      }
      html, body {
        margin: 0; padding: 0;
        background: transparent; /* 关键：透明窗口背景 */
        overflow: hidden;
        user-select: none;
      }
      #pet {
        display: block; width: 240px; height: 240px;
        image-rendering: pixelated;
        cursor: grab;
      }
      /* 头顶状态文字（无框像素块） */
      #bubble {
        position: fixed;
        left: 50%; top: 4px;
        transform: translateX(-50%);
        /* 像素字体：英文走 Press Start 2P（真 8-bit），中文走缝合像素字体（真点阵） */
        font-family: 'Press Start 2P', 'Fusion Pixel', monospace;
        font-size: 18px;           /* 中文字号（缩小一档） */
        line-height: 1.2;
        letter-spacing: 3px;       /* 字距 */
        /* 硬像素阴影：实黑 + 足够偏移，保留立体感（不加 font-smoothing，避免吞掉阴影） */
        text-shadow: 3px 3px 0 #000;
        white-space: nowrap;
        pointer-events: none;
        display: none;
        z-index: 10;
      }
      #bubble.st-working {
        color: #4fc3f7;
        font-size: 10px;           /* 英文 Press Start 2P 用更小字号 */
        letter-spacing: 1px;
      }
      #bubble.st-done { color: #7ed957; }
      #bubble.st-terminated { color: #ff5252; }
      #bubble.st-offline { color: #9e9e9e; }
      #bubble.show { display: inline-block; }
    </style>
  </head>
  <body>
    <canvas id="pet" width="240" height="240"></canvas>
    <div id="bubble"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
