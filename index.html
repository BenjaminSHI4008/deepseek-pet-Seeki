<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Deepseek 桌宠</title>
    <style>
      /* 像素字体（本地打包，离线/国内均可加载） */
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        src: url('./assets/fonts/press-start-2p.woff2') format('woff2');
      }
      html, body {
        margin: 0; padding: 0;
        background: transparent; /* 关键：透明窗口背景 */
        overflow: hidden;
        user-select: none;
      }
      #pet {
        display: block; width: 240px; height: 240px;
        image-rendering: pixelated;
        cursor: grab;
      }
      /* 头顶状态文字（无框像素块，统一英文像素字） */
      #bubble {
        position: fixed;
        left: 50%; top: 4px;
        transform: translateX(-50%);
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        line-height: 1.5;
        letter-spacing: 1px;
        /* 硬像素阴影：实黑 + 偏移，保留立体感 */
        text-shadow: 2px 2px 0 #000;
        white-space: nowrap;
        pointer-events: none;
        display: none;
        z-index: 10;
      }
      #bubble.st-working { color: #4fc3f7; }
      #bubble.st-done { color: #7ed957; }
      #bubble.st-terminated { color: #ff5252; }
      #bubble.st-offline { color: #9e9e9e; }
      #bubble.show { display: inline-block; }
    </style>
  </head>
  <body>
    <canvas id="pet" width="240" height="240"></canvas>
    <div id="bubble"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
