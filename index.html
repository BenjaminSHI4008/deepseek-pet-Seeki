<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Deepseek 桌宠</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        background: transparent; /* 关键：透明窗口背景 */
        overflow: hidden;
        user-select: none;
      }
      #pet {
        display: block; width: 240px; height: 240px;
        image-rendering: pixelated;
        cursor: grab;
      }
      /* 头顶状态气泡 */
      #bubble {
        position: fixed;
        left: 50%; top: 4px;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 12px;
        background: rgba(24, 24, 30, 0.88);
        color: #fff;
        font: 600 12px/1.4 -apple-system, "PingFang SC", sans-serif;
        white-space: nowrap;
        pointer-events: none;
        display: none;
        z-index: 10;
      }
      #bubble::after {
        content: "";
        position: absolute; left: 50%; bottom: -5px;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: rgba(24, 24, 30, 0.88);
        border-bottom: none;
      }
      #bubble.show { display: inline-block; }
    </style>
  </head>
  <body>
    <canvas id="pet" width="240" height="240"></canvas>
    <div id="bubble"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
