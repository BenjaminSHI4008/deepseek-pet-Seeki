<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seeki 行为编辑器</title>
  <style>
    :root {
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --ink-900: #0f172a;
      --ink-700: #334155;
      --ink-500: #64748b;
      --ink-400: #94a3b8;
      --line: rgba(100, 116, 139, .16);
      --line-strong: rgba(100, 116, 139, .26);
      --card: #ffffff;
      --primary: #3b82f6;
      --primary-strong: #2563eb;
      --primary-soft: #eaf2ff;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --success: #16a34a;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --radius-lg: 16px;
      --radius-md: 11px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 20px rgba(15, 23, 42, .06);
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      color: var(--ink-900);
      font: 14px/1.6 var(--font);
      background: #f2f6fb;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 顶部 Header（sticky）── */
    .topbar {
      position: sticky; top: 0; z-index: 60;
      background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1240px; margin: 0 auto; padding: 12px 24px;
      display: flex; align-items: center; gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: radial-gradient(120% 120% at 30% 18%, #dbeafe, #eef6ff 60%);
      box-shadow: inset 0 0 0 1px rgba(59,130,246,.15);
    }
    .brand .logo img { width: 26px; height: 26px; image-rendering: pixelated; object-fit: contain; }
    .brand h1 { font-size: 16px; font-weight: 700; margin: 0; }
    .brand .sub { font-size: 12px; color: var(--ink-400); margin: 0; }
    .topbar .spacer { flex: 1; }
    .dirty-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-500); }
    .dirty-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-400); }
    .dirty-dot.is-dirty { color: var(--warn); }
    .dirty-dot.is-dirty::before { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
    .dirty-dot.is-saved { color: var(--success); }
    .dirty-dot.is-saved::before { background: var(--success); }
    .btn {
      background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm);
      padding: 9px 20px; font: 600 13px var(--font); cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:hover { background: var(--primary-strong); }
    .btn:active { transform: translateY(1px); }
    .btn.ghost { background: transparent; color: var(--ink-500); border: 1px solid var(--line-strong); }
    .btn.ghost:hover { background: #f1f5f9; color: var(--ink-700); }

    /* ── 主体布局：Tabs + 双栏 ── */
    .shell { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .tab {
      border: none; background: transparent; cursor: pointer; font: 600 14px var(--font);
      color: var(--ink-500); padding: 11px 18px; border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--ink-700); }
    .tab.active { color: var(--blue-600); border-bottom-color: var(--blue-600); }
    .tab .n { font-size: 11px; color: var(--ink-400); margin-left: 5px; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
    @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } }

    /* ── 面板 ── */
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .panel-head { display: flex; align-items: center; gap: 11px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
    .panel-head .desc { font-size: 12px; color: var(--ink-400); margin: 1px 0 0; }
    .panel-body { padding: 18px 20px; }

    /* ── 实时预览面板 ── */
    .preview { position: sticky; top: 84px; }
    .pv-stage {
      display: grid; place-items: center; min-height: 220px;
      background: radial-gradient(120% 120% at 50% 30%, #f4f9ff, #e9f1fb);
      border-bottom: 1px solid var(--line);
    }
    .pv-stage img { width: 150px; height: 150px; image-rendering: pixelated; object-fit: contain; }
    .pv-meta { padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .pv-meta .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-500); margin: 3px 0; }
    .pv-meta .row b { color: var(--ink-900); font-weight: 600; }
    .pv-actions { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
    .pv-actions .btn { flex: 1; padding: 8px 0; }
    .pv-relation { padding: 14px 18px; }
    .pv-relation h3 { font-size: 11px; color: var(--ink-400); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px; }
    .flow { display: flex; flex-direction: column; gap: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .flow .step { display: flex; align-items: center; gap: 8px; color: var(--ink-700); }
    .flow .arrow { color: var(--ink-400); }
    .flow .pill { background: var(--primary-soft); color: var(--blue-600); border-radius: 6px; padding: 1px 8px; font-weight: 600; }

    /* ── 表单组件 ── */
    label.fl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-500); margin-bottom: 6px; }
    input[type=text], input[type=number], select {
      width: 100%; padding: 8px 11px; background: #fff; border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm); color: var(--ink-900); font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, input[type=number]:focus, select:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.14);
    }
    input[type=color] { width: 38px; height: 30px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; cursor: pointer; }
    input[type=file] { color: var(--ink-500); font: inherit; width: 100%; }
    input[type=file]::file-selector-button {
      background: var(--primary-soft); color: var(--blue-600); border: none; border-radius: 7px;
      padding: 6px 12px; margin-right: 10px; font: 600 12px var(--font); cursor: pointer;
    }

    .btn-add {
      background: var(--primary-soft); color: var(--blue-600); border: none; border-radius: 7px;
      padding: 6px 14px; font: 600 12px var(--font); cursor: pointer; white-space: nowrap;
      transition: background .15s;
    }
    .btn-add:hover { background: #dbeafe; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; padding: 6px; background: #f8fafc; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); }
    .chip { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }
    .chip .x { cursor: pointer; color: var(--ink-400); font-weight: 700; border-radius: 50%; width: 15px; height: 15px; display: grid; place-items: center; }
    .chip .x:hover { color: var(--danger); background: var(--danger-soft); }
    .chip-add { display: flex; gap: 8px; margin-top: 8px; }
    .chip-add select { flex: 1; }

    /* ── 任务反馈映射表 ── */
    .map-table { width: 100%; border-collapse: collapse; }
    .map-table th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-400); padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .map-table td { padding: 11px 10px; border-bottom: 1px solid rgba(100,116,139,.08); vertical-align: middle; }
    .map-table tbody tr:last-child td { border-bottom: none; }
    .map-table tbody tr { transition: background .15s; }
    .map-table tbody tr:hover { background: rgba(59,130,246,.03); }
    .status-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .status-name .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .status-name .meaning { font-size: 11px; color: var(--ink-400); font-weight: 400; }
    .txt-input { width: 100%; border: 1px solid transparent; background: transparent; padding: 5px 8px; border-radius: 7px; font: inherit; color: var(--ink-900); }
    .txt-input:hover { background: #f8fafc; }
    .txt-input:focus { outline: none; border-color: var(--primary); background: #fff; }
    .color-cell { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--line); flex: none; }

    /* ── 行为规则卡片 ── */
    .rule { border: 1px solid var(--line); border-radius: var(--radius-md); margin-bottom: 14px; overflow: hidden; }
    .rule-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fbfdff; border-bottom: 1px solid var(--line); }
    .rule-head .ico { font-size: 16px; }
    .rule-head .t { font-weight: 700; font-size: 14px; }
    .rule-head .trig { font-size: 12px; color: var(--ink-500); }
    .rule-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .rule-body .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .rule-body .field { flex: 1 1 180px; min-width: 140px; }
    .rule-body .field.grow { flex: 1 1 320px; }
    .flowchain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-500); padding: 8px 12px; background: #f8fafc; border-radius: 8px; }
    .flowchain .k { color: var(--ink-400); }
    .flowchain .v { font-weight: 600; color: var(--ink-900); }
    .flowchain .arr { color: var(--blue-500); }

    /* ── 方向网格 ── */
    .dir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .dir-grid { grid-template-columns: 1fr; } }
    .dir-cell { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 11px 12px; background: #fbfdff; }
    .dir-cell .dir-label { font-size: 12.5px; font-weight: 600; color: var(--ink-700); margin-bottom: 7px; }
    .dir-cell .flip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-500); margin-top: 8px; cursor: pointer; }
    .dir-cell .flip input { accent-color: var(--primary); cursor: pointer; }

    /* ── 动作库卡片 ── */
    .action-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .act-card { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; }
    .act-thumb { display: grid; place-items: center; height: 120px; background: radial-gradient(120% 120% at 50% 30%, #f4f9ff, #e9f1fb); cursor: pointer; }
    .act-thumb img { width: 88px; height: 88px; image-rendering: pixelated; object-fit: contain; }
    .act-body { padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; }
    .act-body .name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; }
    .act-body .meta { font-size: 11.5px; color: var(--ink-400); }
    .act-body .row { display: flex; gap: 7px; margin-top: 3px; }
    .act-body .row .btn { flex: 1; padding: 6px 0; font-size: 12px; }
    .act-edit { border-top: 1px solid var(--line); padding: 11px 13px; background: #fbfdff; display: flex; flex-direction: column; gap: 8px; }
    .act-edit .erow { display: flex; gap: 8px; align-items: center; }
    .act-edit .erow label { width: 58px; font-size: 11.5px; color: var(--ink-500); flex: none; }
    .menu-dots { background: none; border: none; cursor: pointer; color: var(--ink-400); font-size: 16px; padding: 2px 8px; border-radius: 6px; }
    .menu-dots:hover { background: #f1f5f9; color: var(--ink-700); }

    .hint { font-size: 12px; color: var(--ink-400); margin: 0 0 14px; }
    .empty { color: var(--ink-400); padding: 20px 0; text-align: center; }
    .frames-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .frames-grid img { width: 56px; height: 56px; image-rendering: pixelated; background: #f1f5f9; border: 1px solid var(--line); border-radius: 9px; padding: 4px; object-fit: contain; }
    .frame-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding-top: 14px; margin-top: 14px; border-top: 1px dashed var(--line); }
    .frame-row .field { flex: 1 1 160px; min-width: 120px; }
    .frame-row .field-file { flex: 1 1 260px; }
    .divider { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo"><img id="pet-avatar" alt="" onerror="this.style.display='none'" /></span>
        <div>
          <h1>Seeki 行为编辑器</h1>
          <p class="sub">任务反馈 → 角色状态 → 动作</p>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="dirty-dot" id="dirty-dot">已保存</span>
      <button class="btn" id="save">保存配置</button>
    </div>
  </header>

  <div class="shell">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="task">任务反馈<span class="n">Task</span></button>
      <button class="tab" data-tab="state">角色状态<span class="n">State</span></button>
      <button class="tab" data-tab="action">动作库<span class="n">Action</span></button>
    </nav>

    <div class="layout">
      <div class="editor" id="editor"></div>

      <aside class="preview">
        <div class="panel">
          <div class="panel-head"><h2>实时预览</h2></div>
          <div class="pv-stage"><img id="pv-img" alt="Seeki" /></div>
          <div class="pv-meta">
            <div class="row"><span>当前动作</span><b id="pv-action">—</b></div>
            <div class="row"><span>帧数</span><b id="pv-frames">—</b></div>
            <div class="row"><span>帧率</span><b id="pv-fps">—</b></div>
          </div>
          <div class="pv-actions">
            <button class="btn" id="pv-play">▶ 播放动画</button>
            <button class="btn ghost" id="pv-replay">↻ 重播</button>
          </div>
          <div class="pv-relation">
            <h3>状态关系</h3>
            <div class="flow" id="pv-flow"></div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    let config = null
    let frameBust = 0
    let dirty = false
    let currentTab = 'task'
    const API = '/api/pet.config'
    const FRAMES_API = '/api/pet.frames'
    const RESTART_API = '/api/pet.restart'
    const STATUS_MEANING = { received: '收到发送', running: '任务进行', completed: '任务完成', terminated: '任务截止', offline: '离线' }
    const STATUS_DOT = { received: '#f59e0b', running: '#3b82f6', completed: '#16a34a', terminated: '#ef4444', offline: '#94a3b8' }
    const DIR_LABEL = { left: '← 向左', right: '→ 向右', up: '↑ 向上', down: '↓ 向下' }

    // 预览状态
    let pvAction = null
    let pvTimer = null
    let pvFrame = 0

    async function load() {
      const res = await fetch(API)
      if (!res.ok) { setMsg('配置加载失败', true); return }
      config = await res.json()
      normalize()
      frameBust++
      render()
    }

    // 补齐缺失字段（与旧逻辑一致，保持配置格式不变）
    function normalize() {
      config.statusActionMs = config.statusActionMs ?? 2000
      config.characterStates = config.characterStates || {}
      const cs = config.characterStates
      cs.default = cs.default || { play: ['idle'] }
      cs.click = cs.click || { play: ['happy'], returnTo: 'idle', afterMs: 2000 }
      cs.drag = cs.drag || {}
      cs.drag.returnTo = cs.drag.returnTo || 'idle'
      cs.timeout = cs.timeout || { before: 'idle', after: 'sleep', afterMs: 12000 }
      for (const k of ['default', 'click']) {
        if (!Array.isArray(cs[k].play)) cs[k].play = [cs[k].play].filter(Boolean)
      }
      if (!cs.drag.directions) {
        const oldPlay = Array.isArray(cs.drag.play) ? [...cs.drag.play] : []
        cs.drag.directions = { left: { play: oldPlay }, right: { play: oldPlay, flipX: true }, up: { play: [] }, down: { play: [] } }
        delete cs.drag.play
      }
      for (const dir of ['left', 'right', 'up', 'down']) {
        const d = cs.drag.directions[dir] || (cs.drag.directions[dir] = {})
        if (!Array.isArray(d.play)) d.play = []
      }
      for (const s of Object.values(config.statuses || {})) {
        if (!Array.isArray(s.actions)) s.actions = s.action ? [s.action] : []
        delete s.action
      }
    }

    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') }
    function actionLabel(id) { const a = config.actions[id]; return a ? (a.label || id) : id }
    function actionFolder(id) { const a = config.actions[id]; return (a && a.folder) || id }
    function actionSelect(selected, blank) {
      const opts = Object.entries(config.actions).map(([id, a]) =>
        `<option value="${id}" ${id === selected ? 'selected' : ''}>${escapeHtml(a.label || id)}</option>`).join('')
      return (blank ? `<option value="">${blank}</option>` : '') + opts
    }
    function chipsHtml(actions) {
      return (actions || []).map(a =>
        `<span class="chip" data-chip="${a}">${escapeHtml(actionLabel(a))}<span class="x" data-rm="${a}">×</span></span>`).join('')
    }

    function markDirty() { dirty = true; updateDirty() }
    function setMsg(text, isErr) {
      const el = document.getElementById('dirty-dot')
      el.textContent = (isErr ? '⚠ ' : '✓ ') + text
      el.className = 'dirty-dot ' + (isErr ? 'is-dirty' : 'is-saved')
    }
    function updateDirty() {
      const el = document.getElementById('dirty-dot')
      el.textContent = dirty ? '● 有未保存修改' : '✓ 已保存'
      el.className = dirty ? 'dirty-dot is-dirty' : 'dirty-dot is-saved'
    }

    function render() {
      document.getElementById('tabs').querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab))
      const ed = document.getElementById('editor')
      if (currentTab === 'task') ed.innerHTML = renderTaskFeedback()
      else if (currentTab === 'state') ed.innerHTML = renderCharacterStates()
      else ed.innerHTML = renderActionLibrary()
      renderPreview()
      if (currentTab === 'action') fillFrameSelect()
      // 头部 avatar（默认动作第一帧）
      const avatar = document.getElementById('pet-avatar')
      if (avatar) {
        const def = config.characterStates.default.play[0]
        avatar.src = `/pet/frames/${actionFolder(def)}/frame_000.png?${frameBust}`
      }
    }

    // ── Tab 1：任务反馈（映射表）──
    function renderTaskFeedback() {
      const rows = Object.entries(config.statuses).map(([id, s]) => `
        <tr>
          <td><div class="status-name"><span class="dot" style="background:${s.color}"></span><span>${id}</span><span class="meaning">${STATUS_MEANING[id] || ''}</span></div></td>
          <td><input class="txt-input" type="text" data-status="${id}" data-field="text" value="${escapeHtml(s.text)}" /></td>
          <td><div class="color-cell"><span class="swatch" style="background:${s.color}"></span><input type="color" data-status="${id}" data-field="color" value="${s.color}" /></div></td>
          <td>
            <div class="chips status-chips" data-status-chips="${id}">${chipsHtml(s.actions)}</div>
            <div class="chip-add">
              <select data-status-add="${id}">${actionSelect('', '选择动作')}</select>
              <button class="btn-add" data-status-addbtn="${id}">＋添加动作</button>
            </div>
          </td>
        </tr>`).join('')
      return `
        <div class="panel">
          <div class="panel-head"><div><h2>任务反馈映射</h2><p class="desc">系统任务状态 → 头顶气泡文字 / 颜色 → Seeki 播放的动作</p></div></div>
          <div class="panel-body" style="padding:0">
            <table class="map-table">
              <thead><tr><th style="width:150px">任务状态</th><th>显示文字</th><th style="width:90px">颜色</th><th>Seeki 状态 / 动作</th></tr></thead>
              <tbody id="statuses-body">${rows}</tbody>
            </table>
          </div>
        </div>`
    }

    // ── Tab 2：角色状态（行为规则）──
    function renderCharacterStates() {
      const cs = config.characterStates
      const flow = (trig, play, next, ms) => {
        const p = (play || []).map(actionLabel).join(' / ') || '（无）'
        return `<div class="flowchain"><span class="k">${trig}</span><span class="arr">→</span><span class="v">${p}</span>${ms ? `<span class="arr">→</span><span class="k">${ms}ms</span>` : ''}<span class="arr">→</span><span class="v">回到 ${actionLabel(next)}</span></div>`
      }
      const dirCells = ['left', 'right', 'up', 'down'].map(dir => {
        const d = cs.drag.directions[dir]
        const flipX = dir === 'left' || dir === 'right'
        const flipY = dir === 'up' || dir === 'down'
        return `
          <div class="dir-cell">
            <div class="dir-label">${DIR_LABEL[dir]}</div>
            <div class="chips" data-drag-chips="${dir}">${chipsHtml(d.play)}</div>
            <div class="chip-add"><select data-drag-add="${dir}">${actionSelect('', '选择动作')}</select><button class="btn-add" data-drag-addbtn="${dir}">＋添加</button></div>
            <label class="flip"><input type="checkbox" data-drag-flip="${flipX ? 'x' : 'y'}" data-drag-dir="${dir}" ${flipX ? (d.flipX ? 'checked' : '') : (d.flipY ? 'checked' : '')} /> ${flipX ? '水平镜像' : '垂直翻转'}</label>
          </div>`
      }).join('')

      return `
        <div class="panel">
          <div class="panel-head"><div><h2>角色行为规则</h2><p class="desc">触发条件 → 进入状态 → 播放动作 → 结束后返回</p></div></div>
          <div class="panel-body">
            <div class="rule">
              <div class="rule-head"><span class="ico">🖱️</span><span class="t">点击 Seeki</span><span class="trig">当用户点击桌宠时</span></div>
              <div class="rule-body">
                <div class="row">
                  <div class="field grow">
                    <label class="fl">进入状态（多个 = 随机播放）</label>
                    <div class="chips" id="cs-click-play">${chipsHtml(cs.click.play)}</div>
                    <div class="chip-add"><select id="cs-click-add">${actionSelect('', '选择动作')}</select><button class="btn-add" id="cs-click-addbtn">＋添加状态</button></div>
                  </div>
                  <div class="field"><label class="fl">结束后返回</label><select id="cs-click-return">${actionSelect(cs.click.returnTo)}</select></div>
                  <div class="field"><label class="fl">持续时长 (ms)</label><input type="number" id="cs-click-ms" min="0" step="100" value="${cs.click.afterMs}" /></div>
                </div>
                ${flow('点击', cs.click.play, cs.click.returnTo, cs.click.afterMs)}
              </div>
            </div>

            <div class="rule">
              <div class="rule-head"><span class="ico">🧭</span><span class="t">拖动 Seeki</span><span class="trig">按住并拖动桌宠，按方向切换动作</span></div>
              <div class="rule-body">
                <div class="row"><div class="field"><label class="fl">松开后返回</label><select id="cs-drag-return">${actionSelect(cs.drag.returnTo)}</select></div></div>
                <div class="dir-grid">${dirCells}</div>
              </div>
            </div>

            <div class="rule">
              <div class="rule-head"><span class="ico">😴</span><span class="t">长时间无操作</span><span class="trig">空闲超时后自动切换状态</span></div>
              <div class="rule-body">
                <div class="row">
                  <div class="field"><label class="fl">超时前（停留动作）</label><select id="cs-timeout-before">${actionSelect(cs.timeout.before)}</select></div>
                  <div class="field"><label class="fl">超时后（进入动作）</label><select id="cs-timeout-after">${actionSelect(cs.timeout.after)}</select></div>
                  <div class="field"><label class="fl">空闲时长 (ms)</label><input type="number" id="cs-timeout-ms" min="0" step="1000" value="${cs.timeout.afterMs}" /></div>
                </div>
                ${flow('超时', [cs.timeout.after], cs.timeout.before, cs.timeout.afterMs)}
              </div>
            </div>

            <div class="rule">
              <div class="rule-head"><span class="ico">🏠</span><span class="t">默认状态</span><span class="trig">Seeki 常驻的基础动作</span></div>
              <div class="rule-body">
                <div class="row"><div class="field"><label class="fl">默认动作</label><select id="cs-default">${actionSelect(cs.default.play[0])}</select></div></div>
              </div>
            </div>
          </div>
        </div>`
    }

    // ── Tab 3：动作库 ──
    function renderActionLibrary() {
      const cards = Object.entries(config.actions).map(([id, a]) => `
        <div class="act-card" data-act="${id}">
          <div class="act-thumb" data-preview="${id}"><img src="/pet/frames/${actionFolder(id)}/frame_000.png?v=${frameBust}" alt="${escapeHtml(a.label || id)}" /></div>
          <div class="act-body">
            <div class="name">${escapeHtml(a.label || id)}<span style="color:var(--ink-400);font-weight:400;font-size:11px">${id}</span></div>
            <div class="meta">${a.count || 0} Frames · ${a.fps || 0} FPS</div>
            <div class="row">
              <button class="btn" data-preview="${id}">▶ 预览</button>
              <button class="btn ghost" data-edit-act="${id}">编辑</button>
            </div>
            <div class="act-edit" data-edit-panel="${id}" hidden>
              <div class="erow"><label>标签</label><input type="text" data-action="${id}" data-field="label" value="${escapeHtml(a.label)}" /></div>
              <div class="erow"><label>帧目录</label><input type="text" data-action="${id}" data-field="folder" value="${escapeHtml(a.folder)}" /></div>
              <div class="erow"><label>帧长</label><input type="number" min="1" data-action="${id}" data-field="count" value="${a.count}" /></div>
              <div class="erow"><label>帧率</label><input type="number" min="0.1" step="0.1" data-action="${id}" data-field="fps" value="${a.fps}" /></div>
              <div class="row"><button class="btn-add" data-del-action="${id}">删除动作</button></div>
            </div>
          </div>
        </div>`).join('')
      return `
        <div class="panel">
          <div class="panel-head"><div><h2>动作库</h2><p class="desc">Seeki 的动画帧序列；点缩略图或「预览」可实时查看效果</p></div></div>
          <div class="panel-body">
            <div class="action-grid">${cards || '<span class="empty">（暂无动作）</span>'}</div>

            <hr class="divider" />
            <h2 style="font-size:14px;margin:0 0 4px">添加新动作</h2>
            <p class="hint">上传 PNG 帧序列（顺序即播放顺序），自动生成帧目录</p>
            <div class="frame-row">
              <div class="field"><label class="fl">动作名</label><input type="text" id="new-action-name" placeholder="e.g. wave" /></div>
              <div class="field field-file"><label class="fl">帧（PNG 可多选）</label><input type="file" id="new-action-files" accept="image/png" multiple /></div>
              <div class="field"><label class="fl">帧率 fps</label><input type="number" id="new-action-fps" step="0.1" min="0.1" value="5" /></div>
              <div class="field" style="flex:0 0 auto"><button class="btn" id="add-action-btn">添加动作</button></div>
            </div>

            <hr class="divider" />
            <h2 style="font-size:14px;margin:0 0 4px">替换动作帧</h2>
            <div class="frame-row">
              <div class="field"><label class="fl">选择动作</label><select id="frame-action"></select></div>
              <div class="field field-file"><label class="fl">替换帧（PNG 可多选）</label><input type="file" id="replace-files" accept="image/png" multiple /></div>
              <div class="field"><label class="fl">标签（留空沿用）</label><input type="text" id="replace-label" /></div>
              <div class="field"><label class="fl">帧率（留空沿用）</label><input type="number" id="replace-fps" step="0.1" min="0.1" /></div>
              <div class="field" style="flex:0 0 auto"><button class="btn" id="replace-btn">上传替换</button></div>
            </div>
            <div id="frames-grid" class="frames-grid"></div>

            <hr class="divider" />
            <div style="display:flex;align-items:center;gap:12px">
              <button class="btn ghost" id="restart-btn">重启桌宠</button>
              <span id="restart-msg" style="font-size:12.5px;color:var(--ink-500)"></span>
            </div>
          </div>
        </div>`
    }

    // ── 实时预览 ──
    function renderPreview() {
      const def = config.characterStates.default.play[0]
      if (!pvAction) pvAction = def
      const a = config.actions[pvAction]
      const folder = actionFolder(pvAction)
      const count = a ? (a.count || 0) : 0
      document.getElementById('pv-action').textContent = a ? (a.label || pvAction) : '—'
      document.getElementById('pv-frames').textContent = count + ' 帧'
      document.getElementById('pv-fps').textContent = (a ? a.fps : 0) + ' FPS'
      if (count > 0) document.getElementById('pv-img').src = `/pet/frames/${folder}/frame_000.png?v=${frameBust}`

      // 状态关系
      const cs = config.characterStates
      const flow = []
      flow.push(`<div class="step"><span class="pill">默认</span><span class="arrow">→</span><b>${actionLabel(cs.default.play[0])}</b></div>`)
      flow.push(`<div class="step"><span class="pill">点击</span><span class="arrow">→</span><b>${(cs.click.play || []).map(actionLabel).join(' / ') || '—'}</b><span class="arrow">→</span><span class="k">${cs.click.afterMs}ms</span><span class="arrow">→</span><b>${actionLabel(cs.click.returnTo)}</b></div>`)
      flow.push(`<div class="step"><span class="pill">超时</span><span class="arrow">→</span><b>${actionLabel(cs.timeout.after)}</b></div>`)
      for (const [sid, s] of Object.entries(config.statuses)) {
        if (s.actions && s.actions.length) flow.push(`<div class="step"><span class="pill">${STATUS_MEANING[sid] || sid}</span><span class="arrow">→</span><b>${s.actions.map(actionLabel).join(' / ')}</b></div>`)
      }
      document.getElementById('pv-flow').innerHTML = flow.join('')
    }

    function previewAction(id) {
      if (!config.actions[id]) return
      pvAction = id
      pvFrame = 0
      stopPreview()
      renderPreview()
      playPreview()
    }
    function playPreview() {
      stopPreview()
      const a = config.actions[pvAction]
      if (!a || !a.count) return
      const folder = actionFolder(pvAction)
      const interval = Math.max(40, Math.round(1000 / (a.fps || 5)))
      pvTimer = setInterval(() => {
        pvFrame = (pvFrame + 1) % a.count
        const file = `frame_${String(pvFrame).padStart(3, '0')}.png`
        document.getElementById('pv-img').src = `/pet/frames/${folder}/${file}?v=${frameBust}`
      }, interval)
    }
    function stopPreview() { if (pvTimer) { clearInterval(pvTimer); pvTimer = null } }

    // ── 事件绑定 ──
    document.getElementById('tabs').addEventListener('click', (e) => {
      const t = e.target.closest('.tab'); if (!t) return
      currentTab = t.dataset.tab
      render()
    })

    // 实时回写 config（切 Tab 不丢改动），并标记未保存
    document.addEventListener('input', (e) => {
      const t = e.target
      if (t.matches('[data-status][data-field="text"]')) { config.statuses[t.dataset.status].text = t.value; markDirty(); return }
      if (t.matches('[data-action][data-field="label"]')) { config.actions[t.dataset.action].label = t.value; markDirty(); return }
      if (t.matches('[data-action][data-field="folder"]')) { config.actions[t.dataset.action].folder = t.value; markDirty(); return }
      if (t.matches('[data-action][data-field="count"]')) { config.actions[t.dataset.action].count = Number(t.value) || 1; markDirty(); return }
      if (t.matches('[data-action][data-field="fps"]')) { config.actions[t.dataset.action].fps = Number(t.value) || 1; markDirty(); return }
      if (t.id === 'cs-click-ms') { config.characterStates.click.afterMs = Number(t.value) || 0; markDirty() }
      else if (t.id === 'cs-timeout-ms') { config.characterStates.timeout.afterMs = Number(t.value) || 0; markDirty() }
    })
    document.addEventListener('change', (e) => {
      const t = e.target
      if (t.matches('[data-status][data-field="color"]')) { config.statuses[t.dataset.status].color = t.value; markDirty(); return }
      if (t.id === 'cs-default') { config.characterStates.default.play = [t.value]; markDirty() }
      else if (t.id === 'cs-click-return') { config.characterStates.click.returnTo = t.value; markDirty() }
      else if (t.id === 'cs-drag-return') { config.characterStates.drag.returnTo = t.value; markDirty() }
      else if (t.id === 'cs-timeout-before') { config.characterStates.timeout.before = t.value; markDirty() }
      else if (t.id === 'cs-timeout-after') { config.characterStates.timeout.after = t.value; markDirty() }
      else if (t.matches('[data-drag-flip]')) {
        const d = config.characterStates.drag.directions[t.dataset.dragDir]
        if (t.dataset.dragFlip === 'x') d.flipX = t.checked
        else d.flipY = t.checked
        markDirty()
      }
    })

    // 编辑区事件委托：chips 删除/添加、方向、预览、编辑、删除、帧切换
    document.getElementById('editor').addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rm]')
      const chipsEl = e.target.closest('[data-status-chips],[data-drag-chips],#cs-click-play')
      if (rm && chipsEl) {
        const pool = getPool(chipsEl)
        const idx = pool.indexOf(rm.dataset.rm)
        if (idx >= 0) pool.splice(idx, 1)
        chipsEl.innerHTML = chipsHtml(pool)
        markDirty(); return
      }
      const addBtn = e.target.closest('[data-status-addbtn],[data-drag-addbtn],#cs-click-addbtn')
      if (addBtn) {
        const isStatus = addBtn.hasAttribute('data-status-addbtn')
        const isClick = addBtn.id === 'cs-click-addbtn'
        let pool, select
        if (isStatus) { pool = config.statuses[addBtn.dataset.statusAddbtn].actions; select = document.querySelector(`[data-status-add="${addBtn.dataset.statusAddbtn}"]`) }
        else if (isClick) { pool = config.characterStates.click.play; select = document.getElementById('cs-click-add') }
        else { pool = config.characterStates.drag.directions[addBtn.dataset.dragAddbtn].play; select = document.querySelector(`[data-drag-add="${addBtn.dataset.dragAddbtn}"]`) }
        const v = select && select.value
        if (!v) return
        if (!pool.includes(v)) pool.push(v)
        const target = isStatus ? document.querySelector(`[data-status-chips="${addBtn.dataset.statusAddbtn}"]`) : isClick ? document.getElementById('cs-click-play') : document.querySelector(`[data-drag-chips="${addBtn.dataset.dragAddbtn}"]`)
        if (target) target.innerHTML = chipsHtml(pool)
        markDirty(); return
      }
      const pv = e.target.closest('[data-preview]')
      if (pv) { previewAction(pv.dataset.preview); return }
      const edit = e.target.closest('[data-edit-act]')
      if (edit) {
        const panel = document.querySelector(`[data-edit-panel="${edit.dataset.editAct}"]`)
        if (panel) panel.hidden = !panel.hidden
        return
      }
      const del = e.target.closest('[data-del-action]')
      if (del) { deleteAction(del.dataset.delAction); return }
      if (e.target.closest('#add-action-btn')) { addAction(); return }
      if (e.target.closest('#replace-btn')) { replaceFrames(); return }
      if (e.target.closest('#restart-btn')) { restartPet(); return }
    })

    function getPool(chipsEl) {
      if (chipsEl.id === 'cs-click-play') return config.characterStates.click.play
      if (chipsEl.hasAttribute('data-status-chips')) { const s = config.statuses[chipsEl.dataset.statusChips]; if (!Array.isArray(s.actions)) s.actions = []; return s.actions }
      const dir = chipsEl.dataset.dragChips; const d = config.characterStates.drag.directions[dir]; if (!Array.isArray(d.play)) d.play = []; return d.play
    }

    async function readFileBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader()
        r.onload = () => resolve(String(r.result).split(',')[1])
        r.onerror = () => reject(new Error('读取文件失败'))
        r.readAsDataURL(file)
      })
    }
    async function uploadFrames(action, files, label, fps) {
      const frames = []
      for (const f of files) frames.push({ data: await readFileBase64(f) })
      const res = await fetch(FRAMES_API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, label, fps, frames }) })
      const body = await res.json()
      if (!res.ok) throw new Error(body.error || '上传失败')
      return body
    }
    function collectRefs(action) {
      const refs = []
      const cs = config.characterStates || {}
      if ((cs.default?.play || []).includes(action)) refs.push('默认')
      for (const [sid, s] of Object.entries(config.statuses)) if ((s.actions || []).includes(action)) refs.push(`任务状态「${STATUS_MEANING[sid] || sid}」`)
      if ((cs.click?.play || []).includes(action) || cs.click?.returnTo === action) refs.push('点击')
      const dd = cs.drag?.directions || {}
      if (Object.values(dd).some(d => (d.play || []).includes(action)) || cs.drag?.returnTo === action) refs.push('拖动')
      if (cs.timeout?.before === action || cs.timeout?.after === action) refs.push('超时')
      return refs
    }
    async function deleteAction(action) {
      const refs = collectRefs(action)
      const tip = refs.length ? `\n它正被 ${refs.join('、')} 使用，删除后会自动回退。` : ''
      if (!confirm(`确定删除动作「${action}」吗？将同时删除其帧文件。${tip}`)) return
      try {
        const res = await fetch('/api/pet.action', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action }) })
        const body = await res.json()
        if (!res.ok) throw new Error(body.error || '删除失败')
        await load(); setMsg('已删除，记得「重启桌宠」', false); updateDirty()
      } catch (err) { alert(err.message) }
    }

    async function addAction() {
      const name = document.getElementById('new-action-name').value.trim()
      const files = [...document.getElementById('new-action-files').files]
      if (!name) { alert('请输入新动作名'); return }
      if (!files.length) { alert('请选择要上传的 PNG 帧'); return }
      const fps = Number(document.getElementById('new-action-fps').value) || 5
      try {
        await uploadFrames(name, files, name, fps)
        document.getElementById('new-action-name').value = ''; document.getElementById('new-action-files').value = ''
        await load(); setMsg('动作已添加，记得「重启桌宠」', false)
      } catch (e) { alert(e.message) }
    }
    async function replaceFrames() {
      const action = document.getElementById('frame-action').value
      const files = [...document.getElementById('replace-files').files]
      if (!action) { alert('请先选择一个动作'); return }
      if (!files.length) { alert('请选择要上传的 PNG 帧'); return }
      const label = document.getElementById('replace-label').value.trim() || undefined
      const fps = document.getElementById('replace-fps').value ? Number(document.getElementById('replace-fps').value) : undefined
      try {
        await uploadFrames(action, files, label, fps)
        document.getElementById('replace-files').value = ''; document.getElementById('replace-label').value = ''; document.getElementById('replace-fps').value = ''
        await load(); setMsg('帧已更新，记得「重启桌宠」', false)
      } catch (e) { alert(e.message) }
    }
    async function restartPet() {
      const el = document.getElementById('restart-msg'); el.textContent = '重启中…'
      try { const r = await fetch(RESTART_API, { method: 'POST' }); el.textContent = r.ok ? '已重启' : '重启失败' } catch { el.textContent = '重启失败' }
    }

    document.getElementById('pv-play').addEventListener('click', () => playPreview())
    document.getElementById('pv-replay').addEventListener('click', () => { previewAction(pvAction) })

    document.getElementById('save').addEventListener('click', async () => {
      // config 已实时回写，这里直接整体 PUT（保持 JSON Schema 不变）
      const res = await fetch(API, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(config) })
      if (res.ok) { dirty = false; updateDirty(); }
      else { setMsg('保存失败', true) }
    })

    // 帧管理：切换动作 → 渲染帧缩略图
    function renderFrames(actionId) {
      const grid = document.getElementById('frames-grid'); const a = config.actions[actionId]
      if (!a) { grid.innerHTML = '<span class="empty">（暂无动作）</span>'; return }
      const folder = a.folder || actionId
      grid.innerHTML = Array.from({ length: a.count }, (_, i) => `<img src="/pet/frames/${folder}/frame_${String(i).padStart(3, '0')}.png?v=${frameBust}" alt="" />`).join('')
    }
    function fillFrameSelect() {
      const fa = document.getElementById('frame-action')
      if (!fa) return
      const prev = fa.value
      fa.innerHTML = Object.keys(config.actions).map(a => `<option value="${a}">${a}</option>`).join('')
      if (Object.keys(config.actions).includes(prev)) fa.value = prev
      renderFrames(fa.value)
    }

    // 帧管理切换（事件委托，因为动作库渲染后才有该元素）
    document.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'frame-action') renderFrames(e.target.value)
    })

    load()
  </script>
</body>
</html>
