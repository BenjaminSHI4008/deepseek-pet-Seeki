<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桌宠配置</title>
  <style>
    :root { --bg: #141419; --card: #1d1d24; --border: #2e2e38; --text: #e8e8ee; --muted: #9a9aa6; --accent: #4fc3f7; --danger: #ff5252; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h2 { font-size: 16px; margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .dim { color: var(--muted); font-size: 11px; margin-top: 2px; }
    tr:last-child td { border-bottom: none; }
    input[type=text], input[type=number] {
      width: 100%; padding: 6px 8px; background: #121218; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font: inherit;
    }
    input[type=color] { width: 40px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: #121218; }
    select { width: 100%; padding: 6px 8px; background: #121218; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; }
    input[type=file] { color: var(--muted); font: inherit; }
    .color-cell { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); flex: none; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .btn {
      background: var(--accent); color: #04141d; border: none; border-radius: 8px;
      padding: 10px 20px; font: 600 14px inherit; cursor: pointer;
    }
    .btn:hover { opacity: .9; }
    .btn.danger { background: var(--danger); color: #fff; }
    #status-msg, #restart-msg { margin-left: 12px; font-size: 13px; color: var(--muted); }
    #status-msg.ok, #restart-msg.ok { color: #7ed957; }
    #status-msg.err, #restart-msg.err { color: #ff5252; }
    .frames-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .frames-grid img { width: 64px; height: 64px; image-rendering: pixelated; background: #0c0c10; border: 1px solid var(--border); border-radius: 6px; }
    .frames-grid .empty { color: var(--muted); padding: 20px 0; }
    .frame-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 12px 0; padding-top: 12px; border-top: 1px dashed var(--border); }
    .frame-row .field { flex: 1 1 160px; min-width: 120px; }
    .frame-row label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .frame-row .field-file { flex: 1 1 260px; }
    .cs-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 12px 0; }
    .cs-row .field { flex: 1 1 180px; min-width: 130px; }
    .cs-row label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .cs-hint { color: var(--muted); font-size: 12px; margin: -8px 0 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>桌宠配置</h1>
    <p class="sub">任务状态决定头顶气泡文字与颜色；角色状态决定点击 / 拖动 / 超时 / 默认待机播放哪个角色动作；角色动作是精灵动画帧序列。改完点「保存」即时生效；帧变动需「重启桌宠」加载。</p>

    <section>
      <h2>任务状态 Task Statuses</h2>
      <table>
        <thead><tr><th style="width:140px">任务状态</th><th>气泡文字</th><th style="width:120px">颜色</th><th style="width:160px">完成后触发角色动作</th></tr></thead>
        <tbody id="statuses-body"></tbody>
      </table>
    </section>

    <section>
      <h2>角色状态 Character State</h2>
      <p class="cs-hint">把「角色动作」挂到桌宠的各个状态上；下拉选项即下方「角色动作」表里的动作。</p>

      <div class="cs-row">
        <div class="field"><label>默认待机动作（平时一直播放）</label><select id="cs-default"></select></div>
      </div>

      <div class="cs-row">
        <div class="field"><label>点击后播放</label><select id="cs-click-to"></select></div>
        <div class="field"><label>点击后返回</label><select id="cs-click-return"></select></div>
        <div class="field"><label>点击持续（毫秒）</label><input type="number" id="cs-click-ms" min="0" step="100" /></div>
      </div>

      <div class="cs-row">
        <div class="field"><label>拖动中播放</label><select id="cs-drag-during"></select></div>
        <div class="field"><label>拖动松开后</label><select id="cs-drag-after"></select></div>
      </div>

      <div class="cs-row">
        <div class="field"><label>超时前动作（从）</label><select id="cs-timeout-from"></select></div>
        <div class="field"><label>超时后动作（到）</label><select id="cs-timeout-to"></select></div>
        <div class="field"><label>空闲多久超时（毫秒）</label><input type="number" id="cs-timeout-ms" min="0" step="1000" /></div>
      </div>
    </section>

    <section>
      <h2>角色动作 Character Actions</h2>
      <table>
        <thead><tr><th style="width:110px">角色动作</th><th>标签</th><th>帧目录</th><th style="width:90px">帧长 count</th><th style="width:90px">帧率 fps</th></tr></thead>
        <tbody id="actions-body"></tbody>
      </table>
    </section>

    <section>
      <h2>动作帧管理 Frames</h2>
      <div class="frame-row">
        <div class="field"><label>查看动作</label><select id="frame-action"></select></div>
        <div class="field field-file"><label>替换帧（PNG 可多选，顺序即播放顺序）</label><input type="file" id="replace-files" accept="image/png" multiple /></div>
        <div class="field"><label>标签 label（留空沿用原值）</label><input type="text" id="replace-label" /></div>
        <div class="field"><label>帧率 fps（留空沿用原值）</label><input type="number" id="replace-fps" step="0.1" min="0.1" /></div>
        <div class="field"><button class="btn" id="replace-btn">上传替换</button></div>
      </div>
      <div id="frames-grid" class="frames-grid"></div>
      <div class="frame-row">
        <div class="field"><label>新动作名（自动生成帧目录）</label><input type="text" id="new-action-name" placeholder="e.g. wave" /></div>
        <div class="field field-file"><label>帧（PNG 可多选）</label><input type="file" id="new-action-files" accept="image/png" multiple /></div>
        <div class="field"><label>帧率 fps（默认 5）</label><input type="number" id="new-action-fps" step="0.1" min="0.1" value="5" /></div>
        <div class="field"><button class="btn" id="add-action-btn">添加动作</button></div>
      </div>
      <div class="bar" style="margin-top:16px">
        <button class="btn danger" id="restart-btn">重启桌宠</button>
        <span id="restart-msg"></span>
      </div>
    </section>

    <div class="bar">
      <button class="btn" id="save">保存配置</button>
      <span id="status-msg"></span>
    </div>
  </div>

  <script>
    let config = null
    let frameBust = 0
    const API = '/api/pet.config'
    const STATUS_MEANING = { running: '任务进行', completed: '任务完成', terminated: '任务截止', offline: '离线' }
    const FRAMES_API = '/api/pet.frames'
    const RESTART_API = '/api/pet.restart'

    async function load() {
      const res = await fetch(API)
      if (!res.ok) { msg('配置加载失败', true); return }
      config = await res.json()
      normalize()
      frameBust++
      render()
    }

    // 补齐缺失的字段，避免旧配置缺 triggers 时报错
    function normalize() {
      config.defaultAction = config.defaultAction || 'idle'
      config.triggers = config.triggers || {}
      const t = config.triggers
      t.drag = t.drag || { during: 'walk', after: 'idle' }
      t.clickIdle = t.clickIdle || { to: 'happy', returnTo: 'idle', afterMs: 2000 }
      t.timeout = t.timeout || { from: 'idle', to: 'sleep', afterMs: 15000 }
    }

    // 动作下拉选项（显示中文标签，缺标签时退回动作名）
    function actionSelect(selected) {
      return Object.entries(config.actions).map(([id, a]) =>
        `<option value="${id}" ${id === selected ? 'selected' : ''}>${escapeHtml(a.label || id)}</option>`
      ).join('')
    }

    function render() {
      const T = config.triggers
      // 状态表
      const actionOptions = ['<option value="">(无)</option>', ...Object.keys(config.actions).map(a => `<option value="${a}">${a}</option>`)].join('')
      const sb = document.getElementById('statuses-body')
      sb.innerHTML = Object.entries(config.statuses).map(([id, s]) => `
        <tr>
          <td><code>${id}</code><div class="dim">${STATUS_MEANING[id] ?? ''}</div></td>
          <td><input type="text" data-status="${id}" data-field="text" value="${escapeHtml(s.text)}" /></td>
          <td><div class="color-cell">
            <span class="swatch" style="background:${s.color}"></span>
            <input type="color" data-status="${id}" data-field="color" value="${s.color}" />
          </div></td>
          <td><select data-status="${id}" data-field="action">${actionOptions.replace(`value="${s.action ?? ''}"`, `value="${s.action ?? ''}" selected`)}</select></td>
        </tr>`).join('')
      // 动作表
      const ab = document.getElementById('actions-body')
      ab.innerHTML = Object.entries(config.actions).map(([id, a]) => `
        <tr>
          <td><code>${id}</code></td>
          <td><input type="text" data-action="${id}" data-field="label" value="${escapeHtml(a.label)}" /></td>
          <td><input type="text" data-action="${id}" data-field="folder" value="${escapeHtml(a.folder)}" /></td>
          <td><input type="number" min="1" data-action="${id}" data-field="count" value="${a.count}" /></td>
          <td><input type="number" min="0.1" step="0.1" data-action="${id}" data-field="fps" value="${a.fps}" /></td>
        </tr>`).join('')
      // 角色状态
      document.getElementById('cs-default').innerHTML = actionSelect(config.defaultAction)
      document.getElementById('cs-click-to').innerHTML = actionSelect(T.clickIdle.to)
      document.getElementById('cs-click-return').innerHTML = actionSelect(T.clickIdle.returnTo)
      document.getElementById('cs-click-ms').value = T.clickIdle.afterMs
      document.getElementById('cs-drag-during').innerHTML = actionSelect(T.drag.during)
      document.getElementById('cs-drag-after').innerHTML = actionSelect(T.drag.after)
      document.getElementById('cs-timeout-from').innerHTML = actionSelect(T.timeout.from)
      document.getElementById('cs-timeout-to').innerHTML = actionSelect(T.timeout.to)
      document.getElementById('cs-timeout-ms').value = T.timeout.afterMs
      // 帧管理动作下拉
      const fa = document.getElementById('frame-action')
      const prev = fa.value
      fa.innerHTML = Object.keys(config.actions).map(a => `<option value="${a}">${a}</option>`).join('')
      if (Object.keys(config.actions).includes(prev)) fa.value = prev
      renderFrames(fa.value)
    }

    function renderFrames(actionId) {
      const grid = document.getElementById('frames-grid')
      const a = config.actions[actionId]
      if (!a) { grid.innerHTML = '<span class="empty">（暂无动作）</span>'; return }
      const folder = a.folder || actionId
      const imgs = []
      for (let i = 0; i < a.count; i++) {
        const file = `frame_${String(i).padStart(3, '0')}.png`
        imgs.push(`<img src="/pet/frames/${folder}/${file}?v=${frameBust}" alt="${file}" title="${file}" />`)
      }
      grid.innerHTML = imgs.join('')
    }

    document.getElementById('frame-action').addEventListener('change', (e) => renderFrames(e.target.value))

    async function readFileBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader()
        r.onload = () => resolve(String(r.result).split(',')[1])
        r.onerror = () => reject(new Error('读取文件失败'))
        r.readAsDataURL(file)
      })
    }

    async function uploadFrames(action, files, label, fps) {
      const frames = []
      for (const f of files) frames.push({ data: await readFileBase64(f) })
      const res = await fetch(FRAMES_API, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, label, fps, frames }),
      })
      const body = await res.json()
      if (!res.ok) throw new Error(body.error || '上传失败')
      return body
    }

    document.getElementById('replace-btn').addEventListener('click', async () => {
      const action = document.getElementById('frame-action').value
      const files = [...document.getElementById('replace-files').files]
      if (!action) { alert('请先选择一个动作'); return }
      if (files.length === 0) { alert('请选择要上传的 PNG 帧'); return }
      const label = document.getElementById('replace-label').value.trim() || undefined
      const fps = document.getElementById('replace-fps').value ? Number(document.getElementById('replace-fps').value) : undefined
      try {
        await uploadFrames(action, files, label, fps)
        document.getElementById('replace-files').value = ''
        document.getElementById('replace-label').value = ''
        document.getElementById('replace-fps').value = ''
        await load()
        msg('帧已更新，记得「重启桌宠」', false)
      } catch (e) { alert(e.message) }
    })

    document.getElementById('add-action-btn').addEventListener('click', async () => {
      const name = document.getElementById('new-action-name').value.trim()
      const files = [...document.getElementById('new-action-files').files]
      if (!name) { alert('请输入新动作名'); return }
      if (files.length === 0) { alert('请选择要上传的 PNG 帧'); return }
      const fps = Number(document.getElementById('new-action-fps').value) || 5
      try {
        await uploadFrames(name, files, name, fps)
        document.getElementById('new-action-name').value = ''
        document.getElementById('new-action-files').value = ''
        await load()
        msg('动作已添加，记得「重启桌宠」', false)
      } catch (e) { alert(e.message) }
    })

    document.getElementById('restart-btn').addEventListener('click', async () => {
      const msgEl = document.getElementById('restart-msg')
      msgEl.textContent = '重启中…'
      msgEl.className = ''
      try {
        const res = await fetch(RESTART_API, { method: 'POST' })
        if (res.ok) { msgEl.textContent = '已重启'; msgEl.className = 'ok' }
        else { msgEl.textContent = '重启失败'; msgEl.className = 'err' }
      } catch {
        msgEl.textContent = '重启失败'; msgEl.className = 'err'
      }
    })

    document.getElementById('save').addEventListener('click', async () => {
      // 收集状态编辑
      for (const el of document.querySelectorAll('[data-status]')) {
        const s = config.statuses[el.dataset.status]
        const v = el.value
        if (el.dataset.field === 'text') s.text = v
        else if (el.dataset.field === 'color') s.color = v
        else if (el.dataset.field === 'action') s.action = v || null
      }
      // 收集动作编辑
      for (const el of document.querySelectorAll('[data-action]')) {
        const a = config.actions[el.dataset.action]
        const v = el.value
        if (el.dataset.field === 'label') a.label = v
        else if (el.dataset.field === 'folder') a.folder = v
        else if (el.dataset.field === 'count') a.count = Number(v)
        else if (el.dataset.field === 'fps') a.fps = Number(v)
      }
      // 收集角色状态编辑
      config.defaultAction = document.getElementById('cs-default').value
      config.triggers.clickIdle.to = document.getElementById('cs-click-to').value
      config.triggers.clickIdle.returnTo = document.getElementById('cs-click-return').value
      config.triggers.clickIdle.afterMs = Number(document.getElementById('cs-click-ms').value)
      config.triggers.drag.during = document.getElementById('cs-drag-during').value
      config.triggers.drag.after = document.getElementById('cs-drag-after').value
      config.triggers.timeout.from = document.getElementById('cs-timeout-from').value
      config.triggers.timeout.to = document.getElementById('cs-timeout-to').value
      config.triggers.timeout.afterMs = Number(document.getElementById('cs-timeout-ms').value)
      const res = await fetch(API, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(config) })
      if (res.ok) { msg('已保存', false); render() } else { msg('保存失败', true) }
    })

    function msg(text, isErr) {
      const el = document.getElementById('status-msg')
      el.textContent = text
      el.className = isErr ? 'err' : 'ok'
    }
    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') }

    load()
  </script>
</body>
</html>
